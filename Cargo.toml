[package]
name = "kouta"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "High-performance, multi-driver, multi-tier caching library for Rust with stampede defense, SWR, and tag invalidation."
repository = "https://github.com/Hitarashi/kouta"
readme = "README.md"
keywords = ["cache", "caching", "in-memory", "redis", "tiered"]
categories = ["caching", "asynchronous"]

[features]
default = []
redis = ["dep:fred"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.43.4", features = ["sync", "time"] }
fred = { version = "10.1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.43.4", features = ["macros", "rt-multi-thread"] }
